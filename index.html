<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#EDEBE6;color:#2C2C2A;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;font-size:15px;line-height:1.6}
.stage{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 14px}
.note{font-size:12px;color:#8A8880;text-align:center;line-height:1.7;max-width:420px}

.bat{width:22px;height:11px;border:1px solid #2C2C2A;border-radius:3px;position:relative;display:inline-block;vertical-align:middle;margin-left:5px}
.bat::before{content:"";position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#2C2C2A;border-radius:1px}
.bat::after{content:"";position:absolute;right:-3px;top:3px;height:5px;width:2px;background:#2C2C2A;border-radius:0 1px 1px 0}
.navbar{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;border-bottom:.5px solid rgba(0,0,0,.08);font-size:15px;font-weight:500}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.page{display:none;padding:20px 18px 32px}
.page.on{display:block}
.tabbar{flex:0 0 58px;display:flex;border-top:.5px solid rgba(0,0,0,.10);background:#fff;padding-bottom:6px}
.tab{flex:1;text-align:center;font-size:11px;color:#8A8880;padding-top:8px;cursor:pointer}
.tab .dot{display:block;width:20px;height:20px;margin:0 auto 3px;border-radius:6px;border:1.5px solid #C9C7C0}
.tab.on{color:#1D9E75}

.h1{font-size:22px;font-weight:500;line-height:1.35}
.sub{color:#8A8880;font-size:13px;margin-top:4px}

.stat{display:flex;padding:14px 8px;margin-top:18px;margin-bottom:16px}
.si{flex:1;text-align:center}
.si .k{color:#8A8880;font-size:11px}
.si .v{font-size:22px;font-weight:500;margin-top:2px}
.btn-main{width:100%;background:#1D9E75;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:500;padding:15px 0;cursor:pointer;font-family:inherit}
.btn-main:active{opacity:.85}
.tip{text-align:center;color:#A8A6A0;font-size:12px;margin:10px 0 20px}
.result{margin-top:6px}
.tags{margin-bottom:10px}

.tag.hidden{background:#EEEDFE;color:#3C3489}
.tt{font-size:21px;font-weight:500;line-height:1.4}
.dd{font-size:14px;color:#5F5E5A;margin-top:10px}
.need{margin-top:14px;padding:10px 12px;background:#F1EFE8;border-radius:8px;font-size:13px}
.need .k{display:block;color:#8A8880;font-size:11px}
.need .v{display:block;margin-top:2px}
.lab{color:#8A8880;font-size:12px;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap}

.chip.on{background:#E1F5EE;border-color:#1D9E75;color:#0F6E56}
.acts{display:flex;gap:8px;margin-top:18px}
.act{flex:1;text-align:center;padding:10px 0;border-radius:10px;border:.5px solid rgba(0,0,0,.15);background:#fff;font-size:13px;cursor:pointer;font-family:inherit;color:#2C2C2A}
.act:active{opacity:.7}
.act.primary{background:#1D9E75;color:#fff;border-color:#1D9E75}
.foot{color:#A8A6A0;font-size:11px;text-align:center;margin-top:28px}
.rv{font-size:14px;line-height:1.8;color:#444441}

.btns{display:flex;gap:10px;margin-top:14px}
.btns .btn-ghost{flex:1}
.prow{display:flex;justify-content:space-between;font-size:13px;color:#5F5E5A}
.bar{height:8px;background:#F1EFE8;border-radius:999px;margin-top:12px;overflow:hidden}
.fill{height:8px;background:#1D9E75;border-radius:999px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cell{min-height:44px;padding:10px;border:.5px solid rgba(0,0,0,.10);border-radius:8px;background:#fff;color:#B4B2A9;font-size:12px;line-height:1.5}
.cell.got{background:#E1F5EE;border-color:#9FE1CB;color:#0F6E56}
.ct{font-size:15px;font-weight:500}
.hint{color:#8A8880;font-size:12px;line-height:1.7;margin-top:6px}
.inp{width:100%;margin-top:14px;padding:10px 12px;background:#F7F5F1;border:.5px solid rgba(0,0,0,.10);border-radius:8px;font-size:14px;font-family:inherit}
.crow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:.5px solid rgba(0,0,0,.08);font-size:13px}
.cdel{color:#A32D2D;font-size:12px;cursor:pointer;padding-left:14px}
.danger{color:#A32D2D;width:100%;margin-top:14px}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(44,44,42,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;white-space:nowrap}

.sheet{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:15}
.sheet.on{display:flex}
.sheetIn{width:100%;background:#fff;border-radius:16px 16px 0 0;padding:20px 18px 28px}
.shTitle{font-size:13px;color:#8A8880;margin-bottom:14px}
.shCard{background:#F7F5F1;border:.5px solid rgba(0,0,0,.1);border-radius:10px;padding:14px}
.shCard .t{font-size:15px;font-weight:500}
.shCard .d{font-size:12px;color:#8A8880;margin-top:6px}
.shClose{width:100%;margin-top:16px}
@media (max-width:500px){
  body{background:#F7F5F1}
  .stage{padding:0;display:block;min-height:100dvh}

.memorial{position:absolute;inset:0;background:rgba(28,28,26,.55);display:none;flex-direction:column;z-index:18;overflow-y:auto}
.memorial.on{display:flex}
.mIn{background:#F7F5F1;border-radius:16px;margin:22px 14px;padding:16px}
.mTop{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:500;margin-bottom:12px}
.mClose{font-size:13px;color:#8A8880;cursor:pointer;font-weight:400;padding:4px 0 4px 12px}
.mImg img{width:100%;display:block;border-radius:10px;border:.5px solid rgba(0,0,0,.1)}
.mBtns{display:flex;gap:10px;margin-top:14px}
.mBtns .btn-ghost{flex:1}
.mNote{font-size:11px;color:#8A8880;line-height:1.6;margin-top:10px;text-align:center}
.btn-main.sm{font-size:14px;padding:11px 0;margin-top:14px}
</style>

function pad(n){return n<10?'0'+n:''+n}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return keyOf(new Date())}
function shiftKey(k,delta){var p=k.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+delta);return keyOf(d)}
var DEMO=location.hash.indexOf('demo')>-1, _demoState=null;
function seed(){
  var s=defaults();
  var picks=CARDS.filter(function(c){return c.r==='hidden'}).slice(0,2)
    .concat(CARDS.filter(function(c){return c.r==='rare'}).slice(0,3))
    .concat(CARDS.filter(function(c){return c.r==='common'}).slice(0,7));
  picks.forEach(function(c,i){
    var d=new Date();d.setDate(d.getDate()-Math.floor(i/2)-1);
    var k=keyOf(d);
    s.found[c.t]={date:k,r:c.r||'common',mode:(i%3===0?'together':'alone')};
    if(!s.done[k])s.done[k]=[];
    s.done[k].push(c.t);
  });
  return s;
}
function defaults(){return {mode:'alone',done:{},found:{},draws:{},custom:[],createdAt:today()}}

  var raw=null;try{raw=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!raw||typeof raw!=='object')raw=defaults();var d=defaults();for(var k in d){if(!(k in raw))raw[k]=d[k]}if(raw.mode!=='alone'&&raw.mode!=='together')raw.mode='alone';if(!Array.isArray(raw.custom))raw.custom=[];return raw
}
function save(s){

}
function allCards(s){return CARDS.concat(s.custom||[])}
function inMode(c,mode){if(!c.who||!c.who.length)return true;if(mode==='alone')return c.who.indexOf('solo')>-1;for(var i=0;i<c.who.length;i++){if(c.who[i]!=='solo')return true}return false}
function pool(s,mode,exclude){var all=allCards(s),dt=s.done[today()]||[];var usable=all.filter(function(c){return inMode(c,mode)&&c.t!==exclude});var fresh=usable.filter(function(c){return dt.indexOf(c.t)<0});return fresh.length?fresh:usable}
function pick(s,mode,exclude){var p=pool(s,mode,exclude);return p.length?p[Math.floor(Math.random()*p.length)]:null}

function consume(s){var t=today();s.draws[t]=(s.draws[t]||0)+1;return save(s)}

function totalDone(s){var n=0;for(var k in s.done){if(s.done.hasOwnProperty(k))n+=s.done[k].length}return n}

   +'<div class="chips" style="margin-top:14px"><span class="chip '+(s.mode==='alone'?'on':'')+'" data-mode="alone">一个人</span>'
   +'<span class="chip '+(s.mode==='together'?'on':'')+'" data-mode="together">有人陪</span></div></div>'
   +'<div class="card"><div class="ct">加一件自己的小事</div><div class="hint">只写标题就行。内置 '+CARDS.length+' 条，加进来的只会在这台设备上出现。</div>'
   +'<input class="inp" id="inpCustom" placeholder="例如：给冰箱贴张便签"><button class="btn-ghost" id="btnAdd" style="width:100%;margin-top:10px">加上</button>';
  if(s.custom.length){h+='<div style="margin-top:14px">';s.custom.forEach(function(c){h+='<div class="crow"><span>'+esc(c.t)+'</span><span class="cdel" data-del="'+esc(c.t)+'">删掉</span></div>'});h+='</div>'}
  h+='</div><div class="card"><div class="ct">备份与恢复</div><div class="hint">换设备前先复制一份备份存好。</div><div class="btns">'
   +'<button class="btn-ghost" id="btnBackup">复制备份</button><button class="btn-ghost" id="btnRestore">从剪贴板恢复</button></div>'
   +'<button class="btn-ghost danger" id="btnReset">清空全部记录</button></div>'
   +'<div class="card" style="background:transparent;border:none;padding:0"><div class="hint">纯本地小工具：不登录、不收集个人信息、不上传任何内容、没有广告和支付。分享出去的只是预设小事的标题。</div></div>'
   +'<div class="foot">数据不上传，换设备不会自动同步</div>';
  $('#page-settings').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('#page-settings [data-mode]'),function(el){el.onclick=function(){var st=load();st.mode=el.getAttribute('data-mode');S=save(st);renderSettings();toast('已设为默认')}});
  $('#btnAdd').onclick=function(){var v=$('#inpCustom').value.trim();if(!v){toast('先写点什么');return}var st=load();if(allCards(st).some(function(c){return c.t===v})){toast('已经有了');return}st.custom.push({t:v,d:'',n:'',p:'both',m:0,c:'',who:st.mode==='alone'?['solo']:['couple','kid','parent'],r:'common',mine:true});S=save(st);renderSettings();toast('加好了')};
  Array.prototype.forEach.call(document.querySelectorAll('#page-settings [data-del]'),function(el){el.onclick=function(){var t=el.getAttribute('data-del');var st=load();st.custom=st.custom.filter(function(c){return c.t!==t});S=save(st);renderSettings()}});
  $('#btnBackup').onclick=function(){copy(JSON.stringify(load()),'备份已复制')};
  $('#btnRestore').onclick=function(){toast('Demo 里请用「复制备份」后手动粘贴；真小程序支持一键恢复')};
  $('#btnReset').onclick=function(){if(confirm('清空全部记录？做过的事和图鉴都会没有。')){S=save(defaults());cur=null;renderAll();toast('已清空')}};
}
function renderAll(){S=load();renderIndex();renderCollection();renderSettings()}
function showCard(c){if(!c){toast('今天这个条件下都做过了');return}cur=c;renderIndex()}
function onDraw(){var s=load();if(drawsLeft(s)<=0){goTab('collection');return}s=consume(s);showCard(pick(s,S.mode,cur?cur.t:''))}
function onMode(m){if(m===S.mode)return;var s=load();s.mode=m;S=save(s);showCard(pick(S,m,cur?cur.t:''))}
function onDone(){if(!cur)return;var s=load(),wasNew=!s.found[cur.t],finished=cur.t;s=markDone(s,cur,S.mode);S=s;S=save(S);toast(wasNew?'收进图鉴了':'记下了');setTimeout(function(){var s2=load();if((s2.done[today()]||[]).length>=DAILY){cur=null}else{cur=pick(s2,S.mode,finished)}renderAll()},700)}
function onShare(){showSheet('抽到一件小事：'+cur.t,'对方打开直接看到这张卡 · 不消耗次数')}
function showSheet(t,d){$('#shT').textContent=t;$('#shD').textContent=d;$('#sheet').className='sheet on'}
function copy(text,msg){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast(msg)},function(){toast(msg)})}else{toast(msg)}}
function goTab(name){tab=name;Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(el){el.className='tab'+(el.getAttribute('data-tab')===name?' on':'')});Array.prototype.forEach.call(document.querySelectorAll('.page'),function(el){el.className='page'});$('#page-'+name).className='page on';$('#navTitle').textContent=name==='index'?'今天做一件小事':(name==='collection'?'图鉴':'设置');$('#screen').scrollTop=0;if(name==='index')renderIndex();if(name==='collection')renderCollection();if(name==='settings')renderSettings()}
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(el){el.onclick=function(){goTab(el.getAttribute('data-tab'))}});
function cardData(s){
  var y=String(new Date().getFullYear());
  var items=Object.keys(s.found).map(function(t){
    return {t:t,date:s.found[t].date||'',r:s.found[t].r||'common',mode:s.found[t].mode||''};
  }).filter(function(it){return it.date.indexOf(y)===0})
    .sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:0)});
  var alone=0,together=0;
  items.forEach(function(it){if(it.mode==='together')together++;else if(it.mode==='alone')alone++});
  return {year:y,count:items.length,alone:alone,together:together,streak:streak(s),items:items};
}
function fmtDate(s){var p=(s||'').split('-');return p.length===3?(+p[1])+'/'+(+p[2]):(s||'')}
function memText(d){
  var L=[d.year+' 年，做过的 '+d.count+' 件小事','一个人 '+d.alone+' 件 · 有人陪 '+d.together+' 件 · 连续 '+d.streak+' 天',''];
  d.items.slice(0,6).forEach(function(it){
    L.push(fmtDate(it.date)+'  '+it.t+(it.mode==='together'?'（有人陪）':(it.mode==='alone'?'（一个人）':'')));
  });
  if(d.items.length>6)L.push('……还有 '+(d.items.length-6)+' 件');
  L.push('',d.count?'都是些小事，但都做过了。':'先从第一件开始。');
  return L.join('\n');
}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function clipText(x,t,max){var s=t;while(x.measureText(s).width>max&&s.length>1)s=s.slice(0,-1);return s!==t?s+'…':s}
function drawMemorial(d){
  var W=640,H=960,c=document.createElement('canvas');c.width=W;c.height=H;
  var x=c.getContext('2d'),L=62,R=W-62,FM='-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  x.fillStyle='#F7F5F1';x.fillRect(0,0,W,H);
  x.fillStyle='#FFFFFF';rr(x,26,26,W-52,H-52,22);x.fill();
  x.textBaseline='alphabetic';
  x.fillStyle='#1D9E75';x.font='500 62px '+FM;x.fillText(d.year,L,132);
  x.fillStyle='#2C2C2A';x.font='500 25px '+FM;x.fillText(d.count?'今年做过的 '+d.count+' 件小事':'今年还没有做过的小事',L,180);
  x.strokeStyle='#E5E2DB';x.lineWidth=1;x.beginPath();x.moveTo(L,210);x.lineTo(R,210);x.stroke();
  var st=[['一个人',d.alone],['有人陪',d.together],['连续天数',d.streak]];
  st.forEach(function(v,i){var cx=L+i*180;x.fillStyle='#8A8880';x.font='400 15px '+FM;x.fillText(v[0],cx,252);x.fillStyle='#2C2C2A';x.font='500 38px '+FM;x.fillText(String(v[1]),cx,296)});
  x.strokeStyle='#E5E2DB';x.beginPath();x.moveTo(L,326);x.lineTo(R,326);x.stroke();
  x.fillStyle='#8A8880';x.font='400 16px '+FM;x.fillText(d.count?'最近记下的几件':'抽一件，做完就会记在这里',L,368);
  var dots={hidden:'#7F77DD',rare:'#BA7517',common:'#1D9E75'};
  d.items.slice(0,6).forEach(function(it,i){
    var yy=412+i*66;
    x.fillStyle=dots[it.r]||dots.common;x.beginPath();x.arc(L+6,yy-6,5,0,Math.PI*2);x.fill();
    x.fillStyle='#2C2C2A';x.font='400 20px '+FM;x.fillText(clipText(x,it.t,R-L-34),L+24,yy);
    x.fillStyle='#A8A6A0';x.font='400 14px '+FM;
    var m=it.mode==='together'?'有人陪':(it.mode==='alone'?'一个人':'');
    x.fillText(fmtDate(it.date)+(m?' · '+m:''),L+24,yy+22);
  });
  x.strokeStyle='#E5E2DB';x.beginPath();x.moveTo(L,846);x.lineTo(R,846);x.stroke();
  x.fillStyle='#8A8880';x.font='400 17px '+FM;x.fillText(d.count?'都是些小事，但都做过了。':'先从第一件开始。',L,886);
  x.fillStyle='#B4B2A9';x.font='400 13px '+FM;x.fillText('今天做一件小事',L,916);
  return c.toDataURL('image/png');
}
var memCache=null;
function openMemorial(){
  memCache=cardData(load());
  $('#mCard').src=drawMemorial(memCache);
  $('#memorial').className='memorial on';
}
$('#mClose').onclick=function(){$('#memorial').className='memorial'};
$('#memorial').onclick=function(e){if(e.target===this)this.className='memorial'};
$('#mSave').onclick=function(){var a=document.createElement('a');a.href=$('#mCard').src;a.download=memCache.year+'-小事纪念卡.png';document.body.appendChild(a);a.click();document.body.removeChild(a);toast('图片已保存')};
$('#mCopy').onclick=function(){copy(memText(memCache),'文字版已复制')};
$('#shClose').onclick=function(){$('#sheet').className='sheet'};
$('#sheet').onclick=function(e){if(e.target===this)this.className='sheet'};
renderAll();
</script>
</body>
</html>
